<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noxtua Insights Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; }
  
  #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

  /* Sidebar */
  #sidebar { background: #1c1c1e; color: #f5f5f7; display: flex; flex-direction: column; overflow: hidden; }
  #sidebar-header { padding: 16px; border-bottom: 1px solid #3a3a3c; flex-shrink: 0; }
  #sidebar-header h2 { font-size: 13px; font-weight: 600; color: #98989d; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  #progress-bar-bg { background: #3a3a3c; border-radius: 4px; height: 6px; margin-bottom: 6px; }
  #progress-bar { background: #30d158; height: 6px; border-radius: 4px; transition: width 0.3s; }
  #progress-text { font-size: 12px; color: #98989d; }
  #search-box { width: 100%; background: #2c2c2e; border: none; border-radius: 8px; padding: 7px 10px; color: #f5f5f7; font-size: 13px; margin-top: 10px; outline: none; }
  #search-box::placeholder { color: #636366; }
  #sidebar-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sidebar-item { padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 0; transition: background 0.1s; }
  .sidebar-item:hover { background: #2c2c2e; }
  .sidebar-item.active { background: #2c2c2e; border-left: 3px solid #0a84ff; }
  .sidebar-item.reviewed { opacity: 0.55; }
  .sidebar-item.deleted { opacity: 0.4; text-decoration: line-through; }
  .sid-id { font-size: 11px; color: #636366; min-width: 32px; }
  .sid-text { font-size: 12px; line-height: 1.35; color: #e5e5ea; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sid-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-reviewed { background: #30d158; }
  .dot-changed { background: #0a84ff; }
  .dot-deleted { background: #ff453a; }
  .dot-pending { background: #636366; }

  /* Main panel */
  #main { display: flex; flex-direction: column; overflow: hidden; }
  #toolbar { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #toolbar-left { display: flex; align-items: center; gap: 8px; }
  .nav-btn { background: #f5f5f7; border: 1px solid #d1d1d6; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #1d1d1f; }
  .nav-btn:hover { background: #e5e5ea; }
  #position-label { font-size: 13px; color: #636366; }
  #toolbar-right { margin-left: auto; display: flex; gap: 8px; }
  .btn-export { background: #f5f5f7; border: 1px solid #d1d1d6; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #1d1d1f; }
  .btn-export:hover { background: #e5e5ea; }
  .btn-mark { background: #0a84ff; border: none; border-radius: 8px; padding: 6px 16px; font-size: 13px; cursor: pointer; color: #fff; font-weight: 500; }
  .btn-mark:hover { background: #0071e3; }
  .btn-delete { background: #ff453a; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #fff; font-weight: 500; }
  .btn-delete:hover { background: #d70015; }

  #content { flex: 1; overflow-y: auto; padding: 32px 40px; }

  .card { background: #fff; border-radius: 14px; padding: 28px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card-label { font-size: 11px; font-weight: 600; color: #636366; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  
  #insight-id-badge { display: inline-block; background: #f5f5f7; border: 1px solid #e5e5ea; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: #636366; font-weight: 600; margin-bottom: 16px; }
  
  #insight-textarea { width: 100%; border: 1.5px solid #e5e5ea; border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.55; color: #1d1d1f; resize: vertical; min-height: 90px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  #insight-textarea:focus { border-color: #0a84ff; }
  #insight-textarea.changed { border-color: #0a84ff; background: #f0f6ff; }

  .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .meta-field label { display: block; font-size: 11px; font-weight: 600; color: #636366; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .meta-field select { width: 100%; border: 1.5px solid #e5e5ea; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: #1d1d1f; background: #fff; outline: none; cursor: pointer; font-family: inherit; transition: border-color 0.15s; }
  .meta-field select:focus { border-color: #0a84ff; }
  .meta-field select.changed { border-color: #0a84ff; background: #f0f6ff; }
  
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .info-item { }
  .info-item .info-label { font-size: 11px; color: #636366; font-weight: 500; margin-bottom: 3px; }
  .info-item .info-val { font-size: 13px; color: #1d1d1f; }
  
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-block; background: #f0f0f5; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: #3c3c43; }
  
  blockquote { border-left: 3px solid #d1d1d6; padding: 8px 14px; font-size: 13px; color: #3c3c43; font-style: italic; line-height: 1.5; }
  
  .notes-box { font-size: 13px; color: #3c3c43; line-height: 1.5; }

  .deleted-banner { background: #fff3f3; border: 1.5px solid #ff453a; border-radius: 10px; padding: 12px 16px; color: #d70015; font-size: 13px; font-weight: 500; margin-bottom: 20px; }
  .reviewed-badge { display: inline-block; background: #f0fff5; border: 1px solid #30d158; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: #1a7f37; font-weight: 500; margin-left: 8px; }
  
  #delete-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  #delete-modal.open { display: flex; }
  .modal-box { background: #fff; border-radius: 14px; padding: 28px; width: 480px; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
  .modal-box h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .modal-box p { font-size: 14px; color: #636366; margin-bottom: 16px; }
  .modal-box input { border: 1.5px solid #e5e5ea; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; outline: none; }
  .modal-box input:focus { border-color: #0a84ff; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel { background: #f5f5f7; border: 1px solid #d1d1d6; border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
  .btn-confirm-delete { background: #ff453a; border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px; color: #fff; cursor: pointer; font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Insights Review</h2>
      <div id="progress-bar-bg"><div id="progress-bar"></div></div>
      <div id="progress-text"></div>
      <input id="search-box" type="text" placeholder="Search insights…">
    </div>
    <div id="sidebar-list"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <div id="toolbar-left">
        <button class="nav-btn" onclick="navigate(-1)">← Prev</button>
        <button class="nav-btn" onclick="navigate(1)">Next →</button>
        <span id="position-label"></span>
      </div>
      <div id="toolbar-right">
        <button class="btn-export" onclick="exportCSV()">Export CSV</button>
        <button class="btn-delete" onclick="openDeleteModal()">Mark as Merged/Deleted</button>
        <button class="btn-mark" onclick="markReviewed()">Mark as reviewed →</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="delete-modal">
  <div class="modal-box">
    <h3>Merge / Delete Insight</h3>
    <p>Enter the ID this insight should be merged into, or leave blank to just delete it.</p>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <label style="font-size:14px;color:#636366;white-space:nowrap;">Merge into ID</label>
      <input id="delete-merge-id" type="number" placeholder="e.g. 212" style="width:120px;">
      <span style="font-size:13px;color:#636366;">or</span>
      <input id="delete-custom-note" type="text" placeholder="custom note (optional)" style="flex:1;margin-bottom:0;">
    </div>
    <div id="delete-preview" style="font-size:12px;color:#636366;margin-bottom:16px;font-family:monospace;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-confirm-delete" onclick="confirmDelete()">Confirm</button>
    </div>
  </div>
</div>

const STATUSES = [
  "New – Not yet discussed",
  "Identified - JIRA ticket exists",
  "Planned for development",
  "In development",
  "Well done - positive feedback outweighs negative",
  "Won't fix / Out of scope"
];
const TYPES = ["Missing Feature", "Improvement", "General Feedback", "Idea", "Bug"];

// State
let insights = JSON.parse(JSON.stringify(RAW_DATA));
let currentIndex = 0;
let searchQuery = '';

// Find first unreviewed
function findFirstUnreviewed() {
  const idx = insights.findIndex(d => !d.reviewed && !d.deleteNote);
  return idx >= 0 ? idx : 0;
}

function hasChanges(d) {
  return d.insight !== d.originalInsight || d.status !== d.originalStatus || d.type !== d.originalType;
}

function dotClass(d) {
  if (d.deleteNote) return 'dot-deleted';
  if (d.reviewed && hasChanges(d)) return 'dot-changed';
  if (d.reviewed) return 'dot-reviewed';
  return 'dot-pending';
}

function buildSidebar() {
  const list = document.getElementById('sidebar-list');
  const q = searchQuery.toLowerCase();
  list.innerHTML = '';
  insights.forEach((d, i) => {
    const text = d.insight || d.originalInsight || '';
    if (q && !text.toLowerCase().includes(q) && !String(d.id).includes(q)) return;
    const item = document.createElement('div');
    item.className = 'sidebar-item' + (i === currentIndex ? ' active' : '') + (d.reviewed ? ' reviewed' : '') + (d.deleteNote ? ' deleted' : '');
    item.dataset.index = i;
    item.innerHTML = `<span class="sid-id">${d.id}</span><span class="sid-text">${text}</span><span class="sid-dot ${dotClass(d)}"></span>`;
    item.onclick = () => { currentIndex = i; render(); };
    list.appendChild(item);
  });
}

function updateProgress() {
  const total = insights.length;
  const reviewed = insights.filter(d => d.reviewed || d.deleteNote).length;
  const pct = Math.round(reviewed / total * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${reviewed} / ${total} reviewed (${pct}%)`;
}

function render() {
  const d = insights[currentIndex];
  const content = document.getElementById('content');
  const isDeleted = !!d.deleteNote;
  const isReviewed = d.reviewed || isDeleted;
  const changed = hasChanges(d);

  document.getElementById('position-label').textContent = `${currentIndex + 1} of ${insights.length}`;

  let html = `<span id="insight-id-badge">ID ${d.id}</span>`;
  if (isReviewed && !isDeleted) html += `<span class="reviewed-badge">✓ Reviewed${changed ? ' · edited' : ''}</span>`;

  if (isDeleted) {
    html += `<div class="deleted-banner">🗑 ${d.deleteNote}</div>`;
  }

  html += `<div class="card">
    <div class="card-label">Insight Description</div>
    <textarea id="insight-textarea" class="${d.insight !== d.originalInsight ? 'changed' : ''}">${escHtml(d.insight)}</textarea>
  </div>`;

  html += `<div class="card">
    <div class="card-label">Classification</div>
    <div class="meta-row">
      <div class="meta-field">
        <label>Status</label>
        <select id="status-select" class="${d.status !== d.originalStatus ? 'changed' : ''}">
          ${STATUSES.map(s => `<option value="${s}" ${d.status === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="meta-field">
        <label>Type</label>
        <select id="type-select" class="${d.type !== d.originalType ? 'changed' : ''}">
          ${TYPES.map(t => `<option value="${t}" ${d.type === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>`;

  html += `<div class="card">
    <div class="card-label">Details</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-label">Mentions</div><div class="info-val">${d.mentions}</div></div>
      <div class="info-item"><div class="info-label">Sentiment</div><div class="info-val">${d.sentiment || '—'}</div></div>
      <div class="info-item"><div class="info-label">JIRA</div><div class="info-val">${d.jira || '—'}</div></div>
    </div>`;
  if (d.features && d.features.length) {
    html += `<div style="margin-top:12px"><div class="info-label">Features</div><div class="tag-list" style="margin-top:4px">${d.features.map(f=>`<span class="tag">${f}</span>`).join('')}</div></div>`;
  }
  if (d.sourceTypes && d.sourceTypes.length) {
    html += `<div style="margin-top:10px"><div class="info-label">Source Types</div><div class="tag-list" style="margin-top:4px">${d.sourceTypes.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div>`;
  }
  html += `</div>`;

  if (d.quotes) {
    html += `<div class="card"><div class="card-label">Quotes</div><blockquote>${escHtml(d.quotes)}</blockquote></div>`;
  }
  if (d.notes) {
    html += `<div class="card"><div class="card-label">Notes</div><div class="notes-box">${escHtml(d.notes)}</div></div>`;
  }

  content.innerHTML = html;
  content.scrollTop = 0;

  // Wire up live change detection
  const ta = document.getElementById('insight-textarea');
  const ss = document.getElementById('status-select');
  const ts = document.getElementById('type-select');

  ta.addEventListener('input', () => {
    insights[currentIndex].insight = ta.value;
    ta.className = ta.value !== d.originalInsight ? 'changed' : '';
    buildSidebar();
  });
  ss.addEventListener('change', () => {
    insights[currentIndex].status = ss.value;
    ss.className = ss.value !== d.originalStatus ? 'changed' : '';
    buildSidebar();
  });
  ts.addEventListener('change', () => {
    insights[currentIndex].type = ts.value;
    ts.className = ts.value !== d.originalType ? 'changed' : '';
    buildSidebar();
  });

  buildSidebar();
  updateProgress();
  // Scroll active sidebar item into view
  const active = document.querySelector('.sidebar-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function markReviewed() {
  const d = insights[currentIndex];
  d.reviewed = true;
  // Auto-advance to next unreviewed
  let next = -1;
  for (let i = currentIndex + 1; i < insights.length; i++) {
    if (!insights[i].reviewed && !insights[i].deleteNote) { next = i; break; }
  }
  if (next >= 0) { currentIndex = next; } else { currentIndex = Math.min(currentIndex + 1, insights.length - 1); }
  render();
}

function navigate(dir) {
  currentIndex = Math.max(0, Math.min(insights.length - 1, currentIndex + dir));
  render();
}

function openDeleteModal() {
  const d = insights[currentIndex];
  // Pre-fill if already has a delete note
  if (d.deleteNote) {
    const m = d.deleteNote.match(/merged into ID\s*(\d+)/i);
    document.getElementById('delete-merge-id').value = m ? m[1] : '';
    document.getElementById('delete-custom-note').value = m ? '' : d.deleteNote;
  } else {
    document.getElementById('delete-merge-id').value = '';
    document.getElementById('delete-custom-note').value = '';
  }
  updateDeletePreview();
  document.getElementById('delete-modal').classList.add('open');
  document.getElementById('delete-merge-id').focus();
}
function updateDeletePreview() {
  const id = document.getElementById('delete-merge-id').value.trim();
  const custom = document.getElementById('delete-custom-note').value.trim();
  let note = '';
  if (id) note = `DELETE - merged into ID ${id}`;
  else if (custom) note = custom.startsWith('DELETE') ? custom : `DELETE - ${custom}`;
  else note = 'DELETE';
  document.getElementById('delete-preview').textContent = '→ Will save as: "' + note + '"';
}
function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('open'); }
function confirmDelete() {
  const id = document.getElementById('delete-merge-id').value.trim();
  const custom = document.getElementById('delete-custom-note').value.trim();
  let note = '';
  if (id) note = `DELETE - merged into ID ${id}`;
  else if (custom) note = custom.startsWith('DELETE') ? custom : `DELETE - ${custom}`;
  else note = 'DELETE';
  insights[currentIndex].deleteNote = note;
  insights[currentIndex].notes_for_reviewer = note;
  insights[currentIndex].reviewed = true;
  closeDeleteModal();
  let next = -1;
  for (let i = currentIndex + 1; i < insights.length; i++) {
    if (!insights[i].reviewed && !insights[i].deleteNote) { next = i; break; }
  }
  if (next >= 0) currentIndex = next;
  render();
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function exportCSV() {
  const rows = [['id','insight','status','type','mentions','notes_for_reviewer','reviewed']];
  insights.forEach(d => {
    rows.push([
      d.id,
      csvCell(d.insight),
      csvCell(d.status),
      csvCell(d.type),
      d.mentions,
      csvCell(d.deleteNote || d.notes_for_reviewer || ''),
      d.reviewed || !!d.deleteNote ? 'true' : 'false'
    ]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'insights_review.csv';
  a.click();
}

function csvCell(v) {
  const s = String(v||'');
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

// Search
document.getElementById('search-box').addEventListener('input', e => {
  searchQuery = e.target.value;
  buildSidebar();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navigate(-1); }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); markReviewed(); }
});

// Delete modal live preview
document.getElementById('delete-merge-id').addEventListener('input', updateDeletePreview);
document.getElementById('delete-custom-note').addEventListener('input', updateDeletePreview);

// Init
currentIndex = findFirstUnreviewed();
render();
</script>
</body>
</html>
